# The toolchain `ragekit setup` installs into <project>/.ragekit/ (git-ignored), pinned to exact
# versions and checksums. Builds refuse an install that doesn't match these pins (setup again);
# `ragekit doctor` reports what's missing. TYPEPHP_HOME / SLINT_HOME in the environment win.
#
# Per component: an optional git checkout (git + commit), an optional composer.lock copied in
# before `composer install`, patch files applied with `git apply` (they must fit exactly), and
# downloads (url + sha256, extracted into the component's folder or its `to:` subfolder,
# `strip:` leading path components). `platforms:` keys are <os> or <os>-<arch>; lists are appended.

typephp:
  # TypePHP compiles the app's PHP. A source checkout (bin/tpc.php on PHP 8.4+), because our
  # patches change its sources. 5ba93766 = v0.9.5, the version RageKit is tested with.
  git: https://github.com/swoole/typephp.git
  commit: 5ba9376642d8dd75efcd002b41b09a9d6bcca3e2
  composer-lock: typephp/composer.lock
  patches:
    # php-nano doesn't count Core as started: every Nano app using a Core function (strlen, …)
    # failed with "Unable to start PHP Nano extensions". To be reported upstream.
    - typephp/patches/php-nano-core-dependency.patch
  platforms:
    windows-x86_64:
      patches:
        # MSVC builds of php-nano (found 2026-10-25; GNU ld's --gc-sections hides the link errors on
        # Linux): HAVE_SLOW_HASH3 in config.w32.h (php_config.h has it), no SSE4.2 CRC32 resolver
        # (crc32_x86.c isn't built), no ReflectionFiber methods (no fibers). To be reported upstream.
        - typephp/patches/php-nano-windows-msvc.patch
      downloads:
        # PHP's import libraries and DLLs for normal builds (PHP_HOME): TypePHP's v0.9.5 release.
        - url: https://github.com/swoole/typephp/releases/download/v0.9.5/tpc_v0.9.5_windows_x64_php8.5.11-zts.zip
          sha256: 48762306c17449733af770ef501b185c5679bf8623c2794c9c7b435749633355
          to: release
          strip: 1

slint:
  # Slint's prebuilt C++ package and its compiler (Royalty-free / GPLv3 / commercial, see LICENSE).
  version: 1.18.1
  platforms:
    linux-x86_64:
      downloads:
        - url: https://github.com/slint-ui/slint/releases/download/v1.18.1/Slint-cpp-1.18.1-Linux-x86_64.tar.gz
          sha256: f0b24ea601b80afe241677d1179bf5215dceae529f2b275b678a0af9a144b255
          strip: 1
        - url: https://github.com/slint-ui/slint/releases/download/v1.18.1/slint-compiler-Linux-x86_64.tar.gz
          sha256: 543091e6102a02db3403aa77c774a11d9f383b31cb03e25cddad63269a1fb779
          to: bin
    windows-x86_64:
      downloads:
        # An installer (NSIS) holding bin/ (with slint-compiler.exe), include/ and lib/: unpacked
        # with 7-Zip, not run.
        - url: https://github.com/slint-ui/slint/releases/download/v1.18.1/Slint-cpp-1.18.1-win64-MSVC-AMD64.exe
          sha256: eea71789a54982bc1c164d9e1d2c7f00fead1415e9ac396ccb48676f2f66a7a9
