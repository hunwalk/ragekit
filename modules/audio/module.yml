# RageKit's audio module: sound playback with control, via miniaudio (public domain / MIT-0).
name: audio
php: [src]
fetch:
  - url: https://raw.githubusercontent.com/mackron/miniaudio/0.11.22/miniaudio.h
    sha256: 9019743287e443c55e5737a7297f38e5e358561701d6db2d905afb114390c410
    to: native/third_party/miniaudio/miniaudio.h
library:
  sources: [native]
  include-paths: [native, native/third_party/miniaudio]
  platforms: { linux: { link-libs: [dl, pthread, m] } }
functions:
  audio_load:     { params: { path: string }, returns: int }
  audio_play:     { params: { sound: int } }
  audio_pause:    { params: { sound: int } }
  audio_stop:     { params: { sound: int } }
  audio_seek:     { params: { sound: int, seconds: float } }
  audio_volume:   { params: { sound: int, volume: float } }
  audio_position: { params: { sound: int }, returns: float }
  audio_duration: { params: { sound: int }, returns: float }
  audio_playing:  { params: { sound: int }, returns: bool }
  audio_unload:   { params: { sound: int } }
  # Playback speed (1 = normal); miniaudio resamples, so the pitch changes with it.
  audio_speed:    { params: { sound: int, speed: float } }
  # Recording from the default microphone, one at a time: 16 kHz, mono, 16-bit (a voice note).
  # start: 1, or 0 (audio_record_error() says why). Events for handle 0: "level" (0-100, ~10 per
  # second), "full" (the 61 s limit was reached; what came after isn't kept).
  audio_record_start:  { returns: int }
  # Writes the recording as a WAV file to path; returns "<seconds>\n<48 bars 0-100, comma-separated>",
  # or "" when nothing was recording or the file couldn't be written (audio_record_error()).
  audio_record_stop:   { params: { path: string }, returns: string }
  audio_record_cancel: { }
  audio_record_error:  { returns: string }
