name: shadcn
entry: shadcn.slint
elements:
  Button:
    component: ShadButton
    props:
      text: string
      variant: { type: string, enum: [default, outline] }
    events:
      onClick: clicked
  Card:
    component: ShadCard
    props:
      title: string
    children: true
  WindowControls:
    component: ShadWindowControls
    props:
      maximized: bool
    events:
      onMinimize: minimize
      onToggleMaximize: toggle-maximize
      onClose: close
