name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (tests + demos)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # ffi: the crypto and keyring tests call the modules' real libraries; sodium: reference values.
          extensions: mbstring, ffi, sodium
          ini-values: ffi.enable=true
          tools: composer
          coverage: none

      - name: System packages
        # libphp8.4-embed and php8.4-dev (for normal builds) come from the PHP PPA, which
        # setup-php doesn't leave configured.
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git tar xvfb x11-utils \
            libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libinput10 libgbm1 libudev1 \
            libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxtst6 imagemagick \
            php8.4-dev libphp8.4-embed cmake libgmp-dev libmpfr-dev \
            libcurl4-openssl-dev \
            fonts-noto-color-emoji libharfbuzz0b libsecret-1-0 gnome-keyring dbus openssh-client python3-gi gir1.2-glib-2.0 gir1.2-gtk-3.0 libglib2.0-bin xdg-utils \
            dpkg-dev fakeroot desktop-file-utils

      # The pinned toolchain (TypePHP + Slint) and the third-party code kits and modules fetch.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/ragekit/toolchains
            kits/*/library
            modules/*/native/third_party
          key: toolchain-${{ runner.os }}-${{ hashFiles('toolchain/**', 'kits/*/kit.yml', 'modules/*/module.yml') }}

      - name: Composer install
        run: composer install --no-interaction --no-progress

      - name: ragekit setup
        run: php bin/ragekit setup

      - name: ragekit doctor
        run: php bin/ragekit doctor

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          for _ in $(seq 1 50); do DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break; sleep 0.1; done

      - name: Demos, Nano builds (start and close under Xvfb)
        run: DISPLAY=:99 tests/e2e/demos.sh --nano

      # Normal builds link Ubuntu's libphp8.4-embed (see docs/toolchain.md).
      - name: Demos, normal builds (start and close under Xvfb)
        run: DISPLAY=:99 tests/e2e/demos.sh

      - name: Kitchen sink (every tab keeps the window's size, both kits)
        run: |
          DISPLAY=:99 tests/e2e/kitchen-sink.sh
          DISPLAY=:99 tests/e2e/kitchen-sink.sh --kit=material

      - name: Title bar (drag, resize, a button in the bar, close)
        run: DISPLAY=:99 tests/e2e/titlebar.sh

      - name: ScrollView as a chat (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/scroll.sh
          DISPLAY=:99 tests/e2e/scroll.sh --nano
          VIRTUAL=1 DISPLAY=:99 tests/e2e/scroll.sh

      - name: Pressable Views, context menus and shortcuts (normal, Nano, Material)
        run: |
          DISPLAY=:99 tests/e2e/pressable.sh
          DISPLAY=:99 tests/e2e/pressable.sh --nano
          DISPLAY=:99 tests/e2e/pressable.sh --kit=material

      - name: Arrays inside collection rows (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/gallery.sh
          DISPLAY=:99 tests/e2e/gallery.sh --nano

      - name: Markdown text and colour emoji (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/rich-text.sh
          DISPLAY=:99 tests/e2e/rich-text.sh --nano

      - name: Clipboard, text and pasted images (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/clipboard.sh
          DISPLAY=:99 tests/e2e/clipboard.sh --nano
          DISPLAY=:99 tests/e2e/paste-image.sh
          DISPLAY=:99 tests/e2e/paste-image.sh --nano

      - name: Multipart upload through the http module (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/upload.sh
          DISPLAY=:99 tests/e2e/upload.sh --nano

      - name: App links, single instance (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/links.sh
          DISPLAY=:99 tests/e2e/links.sh --nano

      - name: Timers (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/timer.sh
          DISPLAY=:99 tests/e2e/timer.sh --nano

      - name: Crypto module (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/crypto.sh
          DISPLAY=:99 tests/e2e/crypto.sh --nano

      - name: Tray module, an app living in a fake tray (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/tray.sh
          DISPLAY=:99 tests/e2e/tray.sh --nano

      - name: Notifications module, clicked through a fake notification service (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/notifications.sh
          DISPLAY=:99 tests/e2e/notifications.sh --nano

      - name: Dialogs module, file dialogs answered by a fake portal (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/dialogs.sh
          DISPLAY=:99 tests/e2e/dialogs.sh --nano

      - name: Keyring module, a device key in a throwaway keyring (normal and Nano builds)
        run: |
          DISPLAY=:99 tests/e2e/keyring.sh
          DISPLAY=:99 tests/e2e/keyring.sh --nano
