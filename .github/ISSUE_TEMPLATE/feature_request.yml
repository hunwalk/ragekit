name: Feature request
description: Something RageKit should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The app or situation, and what's missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like it to work, e.g. the template or PHP you'd write.
