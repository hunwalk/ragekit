# RageKit's shadcn-style kit: dark zinc palette, 8px radius, 1px borders. Self-contained Slint.
# Same element contract as kits/material (see src/Cli/Kits/ElementSpec.php and PropSpec.php).
name: shadcn
entry: shadcn.slint
fetch:
  # A monospace font for <Text variant="code"> (SIL Open Font License 1.1): Slint 1.18 doesn't
  # resolve the generic "monospace" family, so the kit brings its own (embedded, ~270 KB).
  - url: https://raw.githubusercontent.com/JetBrains/JetBrainsMono/v2.304/fonts/ttf/JetBrainsMono-Regular.ttf
    sha256: a0bf60ef0f83c5ed4d7a75d45838548b1f6873372dfac88f71804491898d138f
    to: fonts/JetBrainsMono-Regular.ttf
window: ShadWindow
elements:
  Label:
    component: ShadLabel
    props:
      text: string
      size: { type: string, enum: [body, title, display] }
  Button:
    component: ShadButton
    props:
      text: string
      variant: { type: string, enum: [default, secondary, outline, ghost, destructive] }
    events:
      onClick: clicked
  Entry:
    component: ShadEntry
    props:
      value: { type: string, property: text, twoWay: edited }
    events:
      onSubmit: submitted
  Checkbox:
    component: ShadCheckbox
    props:
      text: string
      checked: { type: bool, twoWay: toggled }
  Slider:
    component: ShadSlider
    props:
      value: { type: float, twoWay: value_changed }
      min: { type: float, property: minimum }
      max: { type: float, property: maximum }
  Select:
    component: ShadSelect
    props:
      value: { type: string, twoWay: changed }
      options: list
  Image:
    component: ShadImage
    props:
      source: image
  Progress:
    component: ShadProgress
    props:
      value: { type: float, property: progress }
  Card:
    component: ShadCard
    props:
      title: string
    children: true
  Separator:
    component: ShadSeparator
  TabBar:
    component: ShadTabBar
    props:
      titles: list
      selected: { type: int, twoWay: changed }
  WindowControls:
    component: ShadWindowControls
    props:
      maximized: bool
    events:
      onMinimize: minimize
      onToggleMaximize: toggle-maximize
      onClose: close
  Switch:
    component: ShadSwitch
    props:
      text: string
      checked: { type: bool, twoWay: toggled }
  Textarea:
    component: ShadTextarea
    props:
      value: { type: string, property: text, twoWay: edited }
      placeholder: string
      rows: int
      maxRows: { type: int, property: max-rows }
    events:
      onSubmit: { callback: submitted, enables: submit-on-return }
  RadioGroup:
    component: ShadRadioGroup
    props:
      value: { type: string, twoWay: changed }
      options: list
  Toggle:
    component: ShadToggle
    props:
      text: string
      pressed: { type: bool, twoWay: toggled }
  Badge:
    component: ShadBadge
    props:
      text: string
      variant: { type: string, enum: [default, secondary, outline, destructive] }
  Avatar:
    component: ShadAvatar
    props:
      source: image
      text: string
      size: { type: string, enum: [sm, md, lg] }
  Alert:
    component: ShadAlert
    props:
      title: string
      text: string
      variant: { type: string, enum: [default, destructive] }
  Skeleton:
    component: ShadSkeleton
    props:
      width: { type: int, property: w }
      height: { type: int, property: h }
  Spinner:
    component: ShadSpinner
    props:
      size: { type: string, enum: [sm, md, lg] }
  Sidebar:
    component: ShadSidebar
    props:
      title: string
    children: true
  NavList:
    component: ShadNavList
    props:
      items: list
      selected: { type: string, twoWay: changed }
  Breadcrumb:
    component: ShadBreadcrumb
    props:
      items: list
    events:
      onSelect: { callback: selected, value: string }
  Pagination:
    component: ShadPagination
    props:
      page: { type: int, twoWay: changed }
      pages: int
  AccordionHeader:
    component: ShadAccordionHeader
    props:
      title: string
      open: bool
    events:
      onToggle: toggled
  Text:
    component: ShadText
    props:
      text: string
      variant: { type: string, enum: [h1, h2, h3, h4, p, lead, large, small, muted, code, blockquote] }
  Dialog:
    component: ShadDialog
    children: true
    props:
      title: string
    events:
      onDismiss: dismissed
  DropdownMenu:
    component: ShadDropdownMenu
    props:
      text: string
      variant: { type: string, enum: [default, secondary, outline, ghost, destructive] }
      items: list
      variants: list
    events:
      onSelect: { callback: selected, value: int }
  ContextMenu:
    component: ShadContextMenu
    props:
      items: list
      variants: list
    events:
      onSelect: { callback: selected, value: int }
  Toast:
    component: ShadToast
    props:
      text: string
