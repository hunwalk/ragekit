# RageKit's default kit: Slint's Material 3 library (MIT), wrapped once per core element.
# Contract: see src/Cli/Templates/ElementSpec.php and PropSpec.php.
name: material
entry: rk-material.slint
# Slint's Material library (MIT), at the Slint version RageKit uses; fetched into library/.
fetch:
  - git: https://github.com/slint-ui/slint.git
    ref: v1.18.1
    commit: 372cf0ee5577c3dfec309a45e7b778ba4e81b734
    path: ui-libraries/material/src
    to: library
libraries:
  material: ${KIT}/library/material.slint
window: RkWindow
elements:
  Label:
    component: RkLabel
    props:
      text: string
      size: { type: string, enum: [body, title, display] }
  Button:
    component: RkButton
    props:
      text: string
      variant: { type: string, enum: [default, secondary, outline, ghost, destructive] }
    events:
      onClick: clicked
  Entry:
    component: RkEntry
    props:
      value: { type: string, property: text, twoWay: edited }
  Checkbox:
    component: RkCheckbox
    props:
      text: string
      checked: { type: bool, twoWay: toggled }
  Slider:
    component: RkSlider
    props:
      value: { type: float, twoWay: value_changed }
      min: { type: float, property: minimum }
      max: { type: float, property: maximum }
  Select:
    component: RkSelect
    props:
      value: { type: string, twoWay: changed }
      options: list
  Image:
    component: RkImage
    props:
      source: image
  Progress:
    component: RkProgress
    props:
      value: { type: float, property: progress }
  Card:
    component: RkCard
    props:
      title: string
    children: true
  Separator:
    component: RkSeparator
  TabBar:
    component: RkTabBar
    props:
      titles: list
      selected: { type: int, twoWay: changed }
  WindowControls:
    component: RkWindowControls
    props:
      maximized: bool
    events:
      onMinimize: minimize
      onToggleMaximize: toggle-maximize
      onClose: close
  Switch:
    component: RkSwitch
    props:
      text: string
      checked: { type: bool, twoWay: toggled }
  Textarea:
    component: RkTextarea
    props:
      value: { type: string, property: text, twoWay: edited }
      placeholder: string
      rows: int
  RadioGroup:
    component: RkRadioGroup
    props:
      value: { type: string, twoWay: changed }
      options: list
  Toggle:
    component: RkToggle
    props:
      text: string
      pressed: { type: bool, twoWay: toggled }
  Badge:
    component: RkBadge
    props:
      text: string
      variant: { type: string, enum: [default, secondary, outline, destructive] }
  Avatar:
    component: RkAvatar
    props:
      source: image
      text: string
      size: { type: string, enum: [sm, md, lg] }
  Alert:
    component: RkAlert
    props:
      title: string
      text: string
      variant: { type: string, enum: [default, destructive] }
  Skeleton:
    component: RkSkeleton
    props:
      width: { type: int, property: w }
      height: { type: int, property: h }
  Spinner:
    component: RkSpinner
    props:
      size: { type: string, enum: [sm, md, lg] }
  Sidebar:
    component: RkSidebar
    props:
      title: string
    children: true
  NavList:
    component: RkNavList
    props:
      items: list
      selected: { type: string, twoWay: changed }
  Breadcrumb:
    component: RkBreadcrumb
    props:
      items: list
    events:
      onSelect: { callback: selected, value: string }
  Pagination:
    component: RkPagination
    props:
      page: { type: int, twoWay: changed }
      pages: int
  AccordionHeader:
    component: RkAccordionHeader
    props:
      title: string
      open: bool
    events:
      onToggle: toggled
  Text:
    component: RkText
    props:
      text: string
      variant: { type: string, enum: [h1, h2, h3, h4, p, lead, large, small, muted, code, blockquote] }
  Dialog:
    component: RkDialog
    children: true
    props:
      title: string
    events:
      onDismiss: dismissed
  DropdownMenu:
    component: RkDropdownMenu
    props:
      text: string
      variant: { type: string, enum: [default, secondary, outline, ghost, destructive] }
      items: list
      variants: list
    events:
      onSelect: { callback: selected, value: int }
  Toast:
    component: RkToast
    props:
      text: string
