# Every core element and the desktop features, by section, in one window:
#   cd demo/kitchen-sink && ../../bin/ragekit run          (--kit=material to compare kits)
name: kitchen-sink
sources:
  - main.php
  - src

ragekit:
  backend: slint
  renderer: software
  kit: shadcn
  modules: [notifications, tray, crypto, audio]
  assets: [assets/]
  icon: assets/logo.svg
